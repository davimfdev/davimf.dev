# Configuração do nginx que serve o build do Vite (container davimf-site).
#
# No Coolify (Static Site / Nixpacks) cole este conteúdo em
# "Custom Nginx Configuration". A raiz do site é o publish directory (/dist).
#
# NÃO há bloco /api aqui: quem encaminha /api/ para o backend é o
# Nginx Proxy Manager, um nível acima. Ver docs/VPS_MIGRATION.md.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Erros de upstream/arquivo não devem vazar a versão do nginx.
    server_tokens off;

    # Cabeçalhos de segurança básicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Assets com hash no nome: cache agressivo.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|avif|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # O HTML nunca pode ficar em cache: é ele que aponta para os assets novos.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: /dashboard, /r/<code>, /todo, /fmm-activated etc. são rotas
    # do React Router e não existem como arquivo no disco.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
