# Configuração do nginx que serve o build do Vite (container davimf-site).
#
# No Coolify (Static Site / Nixpacks) cole este conteúdo em
# "Custom Nginx Configuration". A raiz do site é o publish directory (/dist).
#
# NÃO há bloco /api aqui: quem encaminha /api/ para o backend é o
# Nginx Proxy Manager, um nível acima. Ver docs/VPS_MIGRATION.md.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Erros de upstream/arquivo não devem vazar a versão do nginx.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ------------------------------------------------------------------
    # Cabeçalhos de segurança
    #
    # ARMADILHA DO NGINX: `add_header` NÃO é acumulativo entre níveis. Um
    # único `add_header` dentro de um `location` descarta TODOS os herdados
    # do bloco `server`. Os dois blocos de cache abaixo definem Cache-Control,
    # ou seja: sem repetir a lista inteira em cada um, `/` ficaria protegido e
    # `/index.html` — para onde o try_files cai — não ficaria. Por isso o
    # bloco está duplicado DE PROPÓSITO nos três `location`. Ao editar um,
    # edite os outros.
    #
    # CSP em DUAS ETAPAS, e a razão é o checkout:
    #
    #  - a política APLICADA fecha o que não depende de terceiros: framing
    #    (clickjacking), <object>/<embed>, <base>, envio de formulário para
    #    fora do site e conteúdo misto. Ela deixa script/frame/connect
    #    abertos para qualquer origem https:, então NÃO tem como derrubar o
    #    MercadoPago.js, os iframes de Secure Fields nem o desafio 3DS — cuja
    #    página vem do EMISSOR do cartão, num domínio imprevisível;
    #  - a política REPORT-ONLY é a versão estreita de verdade, com a lista
    #    real de origens. Ela só reporta no console do navegador, não bloqueia
    #    nada. Depois de UM checkout completo (cartão + 3DS) sem violação,
    #    promova-a: renomeie para Content-Security-Policy e apague a frouxa.
    #
    # Sem `report-uri`: não existe endpoint coletor. As violações aparecem no
    # DevTools de quem testa, o que basta para essa validação manual.
    #
    # Permissions-Policy lista SÓ recursos que o site não usa. `payment` e
    # `publickey-credentials-get` ficam de fora de propósito: o iframe do 3DS
    # os recebe por delegação via atributo `allow` (ThreeDsChallenge.tsx), e
    # nomeá-los aqui com allowlist fechada mataria essa delegação.
    # ------------------------------------------------------------------

    # Assets com hash no nome: cache agressivo.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|avif|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src https:; media-src 'self' https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://sdk.mercadopago.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.discordapp.com https://fiverr-res.cloudinary.com https://bs-uploads.toptal.io https://*.mlstatic.com; connect-src 'self' https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com https://formspree.io; frame-src https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;
        access_log off;
    }

    # O HTML nunca pode ficar em cache: é ele que aponta para os assets novos.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src https:; media-src 'self' https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://sdk.mercadopago.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.discordapp.com https://fiverr-res.cloudinary.com https://bs-uploads.toptal.io https://*.mlstatic.com; connect-src 'self' https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com https://formspree.io; frame-src https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    # SPA fallback: /dashboard, /r/<code>, /todo, /fmm-activated etc. são rotas
    # do React Router e não existem como arquivo no disco.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src https:; media-src 'self' https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://sdk.mercadopago.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.discordapp.com https://fiverr-res.cloudinary.com https://bs-uploads.toptal.io https://*.mlstatic.com; connect-src 'self' https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com https://formspree.io; frame-src https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;
        try_files $uri $uri/ /index.html;
    }
}
