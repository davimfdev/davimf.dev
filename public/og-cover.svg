<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <radialGradient id="glow" cx="22%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#1c1814"/>
      <stop offset="55%" stop-color="#0e0d0c"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D08A"/>
      <stop offset="55%" stop-color="#E6B566"/>
      <stop offset="100%" stop-color="#C9913F"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6B566" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E6B566" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E6B566" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E6B566" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#E6B566" stroke-opacity="0.18" stroke-width="2"/>

  <!-- top label row -->
  <text x="80" y="86" fill="#7e756a" font-size="17" letter-spacing="6" font-weight="600">DESENVOLVEDOR · BACK-END · BOTS</text>
  <text x="1120" y="86" fill="#7e756a" font-size="17" letter-spacing="3" text-anchor="end" font-weight="600">davimf.dev</text>
  <line x1="80" y1="104" x2="1120" y2="104" stroke="url(#hair)" stroke-width="1.5"/>

  <!-- monogram mark -->
  <g transform="translate(80,210)">
    <rect x="0" y="0" width="118" height="118" rx="22" fill="none" stroke="url(#amber)" stroke-width="3"/>
    <text x="59" y="92" text-anchor="middle" fill="url(#amber)" font-size="92" font-weight="800" font-family="'Cabinet Grotesk','Segoe UI',Arial">D</text>
    <rect x="22" y="100" width="74" height="6" rx="3" fill="#E6B566" opacity="0.85"/>
  </g>

  <!-- wordmark -->
  <text x="232" y="262" fill="#F5F3EF" font-size="84" font-weight="800" font-family="'Cabinet Grotesk','Segoe UI',Arial" letter-spacing="-1">Davimf<tspan fill="url(#amber)">.dev</tspan></text>
  <text x="234" y="312" fill="#b9ae9f" font-size="26" font-weight="500">Bots robustos sob medida · moderação · segurança</text>

  <!-- service chips -->
  <g font-size="24" font-weight="700">
    <g transform="translate(80,402)">
      <rect width="328" height="120" rx="16" fill="#13110e" stroke="#E6B566" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="26" y="50" fill="url(#amber)" font-size="15" letter-spacing="3" font-weight="700">SERVIÇO 01</text>
      <text x="26" y="86" fill="#F5F3EF">Bots Personalizados</text>
    </g>
    <g transform="translate(436,402)">
      <rect width="328" height="120" rx="16" fill="#13110e" stroke="#E6B566" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="26" y="50" fill="url(#amber)" font-size="15" letter-spacing="3" font-weight="700">SERVIÇO 02</text>
      <text x="26" y="86" fill="#F5F3EF">Bot de Facção FiveM</text>
    </g>
    <g transform="translate(792,402)">
      <rect width="328" height="120" rx="16" fill="#13110e" stroke="#E6B566" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="26" y="50" fill="url(#amber)" font-size="15" letter-spacing="3" font-weight="700">SERVIÇO 03</text>
      <text x="26" y="86" fill="#F5F3EF">FiveM Mod Manager</text>
    </g>
  </g>

  <!-- footer -->
  <text x="80" y="582" fill="#6f675c" font-size="17" letter-spacing="1">Gerenciador de mods FiveM · bot profissional · bot de Discord</text>
  <circle cx="1104" cy="576" r="6" fill="#E6B566"/>
  <text x="1086" y="582" fill="#9a8f80" font-size="17" text-anchor="end" font-weight="600">Sob encomenda</text>
</svg>
